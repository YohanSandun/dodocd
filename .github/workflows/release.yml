# Builds the DodoCD package (dodocd-x.y.z.zip with a signed manifest).
# Pushing a tag like v1.2.0 publishes it as a GitHub release; DODO_VERSION must match the tag.
# Running it by hand builds a package as a workflow artifact, without publishing anything.
#
# Building and publishing are separate jobs, so the job that holds the signing key has a read-only
# token and the job with write access never sees the key or runs third-party actions.
# Actions are pinned to commit SHAs; the comment after each one is the version it points to.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          extensions: openssl, pdo_sqlite, zip
          coverage: none

      - name: Lint
        run: |
          for f in $(git ls-files '*.php'); do
            php -l "$f" > /dev/null || exit 1
          done

      - name: Build package
        env:
          DODOCD_SIGNING_KEY: ${{ secrets.DODOCD_SIGNING_KEY }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            php tools/build-package.php --out build --tag "$GITHUB_REF_NAME" --require-signature
          else
            php tools/build-package.php --out build
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dodocd-package
          path: build/

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dodocd-package
          path: build/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp build/dodocd-*.zip build/dodocd.zip
          gh release create "$GITHUB_REF_NAME" build/* --title "DodoCD ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
